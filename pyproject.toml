[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-ingestion"
version = "0.1.0"
description = "Crash-safe, batch-oriented ingestion for an Obsidian second brain vault"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["second_brain*"]
